<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер привычек — компонент HabitCard (тестовый проект ДЗ1)</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --accent: #2563eb; --accent-soft: #dbeafe; --ok: #16a34a; --ok-soft: #dcfce7;
    --danger: #dc2626; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 10px; }

  .habit-card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    border: 1px solid #e5e7eb;
  }
  .habit-card__done .habit-card__check { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .habit-card__check {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid #d1d5db; color: #d1d5db;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; background: transparent; flex: none;
    transition: transform .08s ease;
  }
  .habit-card__check:active { transform: scale(.92); }
  .habit-card__body { flex: 1; min-width: 0; }
  .habit-card__name { font-weight: 600; font-size: 16px; }
  .habit-card__meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .habit-card__streak {
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .habit-card__streak--dead { background: #f3f4f6; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Мои привычки</h1>
  <p class="sub">Тестовый компонент HabitCard для проекта «Трекер привычек» (ДЗ1, Шаг 5). Данные — Mock.</p>
  <div id="habits"></div>
</main>

<script src="streak.js"></script>
<script>
  // Mock-данные: истории отметок по привычкам (формат 'YYYY-MM-DD')
  const TODAY = '2026-10-08';
  const habits = [
    { id: 1, name: 'Утренняя зарядка', icon: '🏃',
      entries: ['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'] },
    { id: 2, name: 'Чтение 30 минут', icon: '📖',
      entries: ['2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07'] },
    { id: 3, name: 'Без сахара', icon: '🚫🍬',
      entries: ['2026-09-28','2026-09-29'] },
  ];

  const list = document.getElementById('habits');

  function render() {
    list.innerHTML = '';
    for (const h of habits) {
      const done = h.entries.includes(TODAY);
      const streak = calculateStreak(h.entries, new Date(TODAY));

      const card = document.createElement('div');
      card.className = 'habit-card' + (done ? ' habit-card__done' : '');
      card.innerHTML =
        '<button class="habit-card__check" aria-label="Отметить выполнение">' + (done ? '✓' : '') + '</button>' +
        '<div class="habit-card__body">' +
          '<div class="habit-card__name">' + h.icon + ' ' + h.name + '</div>' +
          '<div class="habit-card__meta">' + (done ? 'Выполнено сегодня' : 'Не отмечено сегодня') + '</div>' +
        '</div>' +
        '<div class="habit-card__streak' + (streak === 0 ? ' habit-card__streak--dead' : '') + '">🔥 ' + streak + '</div>';

      card.querySelector('button').addEventListener('click', () => {
        if (!h.entries.includes(TODAY)) h.entries.push(TODAY);
        render();
      });
      list.appendChild(card);
    }
  }

  render();
</script>
</body>
</html>
